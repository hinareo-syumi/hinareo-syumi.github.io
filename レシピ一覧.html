<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>レシピ一覧｜ひなれお's Kitchen</title>
<style>
body {
  margin: 0;
  font-family: "Hiragino Kaku Gothic ProN", sans-serif;
  background: #fffaf3;
}

header {
  background: #ff9f43;
  color: white;
  padding: 20px;
  text-align: center;
}

.grid {
  max-width: 1000px;
  margin: 30px auto;
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(220px,1fr));
  gap: 20px;
}

@media (max-width: 768px) {
  .grid {
    grid-template-columns: repeat(2, 1fr);
  }
}

@media (max-width: 480px) {
  .grid {
    grid-template-columns: 1fr;
  }
}

@media (max-width: 480px) {
  .search-box input {
    width: 90%;
  }

  .category-buttons {
  display: flex;
  justify-content: center;
  flex-wrap: wrap;
  gap: 8px;
  margin-bottom: 20px;
  }

  .category-buttons button {
    font-size: 12px;
    padding: 6px 10px;
  }
}

@media (max-width: 480px) {
  h1 { font-size: 22px; }
  h2 { font-size: 14px; }
}

.card {
  background: white;
  border-radius: 12px;
  overflow: hidden;
  text-align: center;
  text-decoration: none;
  color: black;

  transition: 0.3s;
}

.card:hover {
  transform: translateY(-6px);
  box-shadow: 0 10px 20px rgba(0,0,0,0.15);
}

.card img {
  width: 100%;
  height: 160px;
  object-fit: cover;
}

.card h3 {
  margin: 10px 0;
}

.search-box {
  text-align: center;
  margin: 30px 0;
}

.search-box input {
  width: 280px;
  padding: 12px 16px;
  border-radius: 30px;
  border: 2px solid #ffa84d;
  font-size: 16px;
  outline: none;
}

.category-buttons {
  text-align: center;
  margin-bottom: 20px;
}

.category-buttons button {
  background: white;
  border: 2px solid #ffa84d;
  color: #ff9f43;
  padding: 8px 20px;
  border-radius: 20px;
  margin: 0 6px;
  cursor: pointer;
  font-weight: bold;
}

.category-buttons button:hover {
  background: #ff9f43;
  color: white;
}

@media (max-width: 480px) {
  .card img {
    width: 70%;
    height: auto;
    object-fit: contain;
    background: #fffaf3;
    margin: 10px auto 0;
    display: block;
  }
}

@media (max-width: 480px) {
  .card {
    padding-bottom: 10px;
  }
}

</style>
</head>

<body>

<header>
  <h1>レシピ一覧</h1>
  <p>これまでのレシピ</p>
</header>

<div class="search-box">
  <input type="text" id="searchInput" placeholder="レシピを検索…">
</div>

<div class="category-buttons">
  <button onclick="filterCategory('all')">すべて</button>
  <button onclick="filterCategory('wasyoku')">和食</button>
  <button onclick="filterCategory('yousyoku')">洋食</button>
  <button onclick="filterCategory('tyuuka')">中華</button>
  <button onclick="filterCategory('men')">麺</button>
  <button onclick="filterCategory('oyatu')">おやつ</button>
  <button onclick="filterCategory('sonota')">和洋中以外</button>
  <button onclick="filterCategory('saigen')">再現</button>
</div>

<div class="grid">

 <a class="card recipe-card oyatu" href="レシピパウンドケーキ.html">
    <img src="画像パウンドケーキ1.jpg">
    <h3>パウンドケーキ</h3>
 </a>

 <a class="card recipe-card tyuuka" href="レシピ麻婆豆腐.html">
    <img src="画像麻婆豆腐1.jpg">
    <h3>麻婆豆腐</h3>
 </a>

</div>

<div style="text-align:center; margin:40px;">
  <a href="index.html" style="
    display:inline-block;
    background:#ff9f43;
    color:white;
    padding:12px 30px;
    border-radius:30px;
    text-decoration:none;
    font-weight:bold;
  ">
    ← トップページへ戻る
  </a>
</div>

<script>
const input = document.getElementById("searchInput");
const cards = document.querySelectorAll(".recipe-card");

input.addEventListener("input", function () {
  const keyword = input.value.toLowerCase();

  cards.forEach(function(card){
    const text = card.innerText.toLowerCase();
    card.style.display = text.includes(keyword) ? "block" : "none";
  });
});

function filterCategory(category) {
  const cards = document.querySelectorAll(".recipe-card");

  cards.forEach(card => {
    if (category === "all" || card.classList.contains(category)) {
      card.style.display = "block";
    } else {
      card.style.display = "none";
    }
  });
}

// URLの ?cat=〇〇 を読む
const params = new URLSearchParams(window.location.search);
const startCategory = params.get("cat");

if (startCategory) {
  filterCategory(startCategory);
}

</script>

</body>
</html>
