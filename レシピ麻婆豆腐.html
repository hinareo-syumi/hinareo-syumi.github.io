<body>

<header>
  <h1>麻婆豆腐</h1>
  <p>調味料から簡単手作りで美味しくなる</p>
</header>

<section>
  <h2>材料（4人分）</h2>
  <ul>
    <li>豚ひき肉 200g</li>
    <li>豆腐 400g</li>
    <li>ねぎ 好きなだけ</li>
    <li>にんにく 小さじ1</li>
    <li>甜麺醤 小さじ3</li>
    <li>豆板醤 小さじ1</li>
    <li>鶏ガラ 小さじ1</li>
    <li>水 150cc</li>
    <li>醤油 大さじ1</li>
    <li>酒 大さじ1</li>
  </ul>

  <h2>作り方</h2>
  <ol>
    <li>豚ひき肉を炒める</li>
    <li>火が通ったらいったん火を止めて調味料を混ぜる</li>
    <li>鶏ガラと水を入れる</li>
    <li>沸騰したら豆腐、ねぎ、醤油、酒を入れる</li>
    <li>水溶き片栗粉でとろみをつけたら完成</li>
  </ol>
